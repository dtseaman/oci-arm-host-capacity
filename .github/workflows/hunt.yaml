name: Oracle Ampere Hunter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, openssl

      - name: Download Clean Script Structure
        run: |
          mkdir -p src
          curl -sS https://raw.githubusercontent.com/hitrov/oci-arm-host-capacity/main/index.php > index.php
          curl -sS https://raw.githubusercontent.com/hitrov/oci-arm-host-capacity/main/src/OciConfig.php > src/OciConfig.php
          curl -sS https://raw.githubusercontent.com/hitrov/oci-arm-host-capacity/main/src/OciApi.php > src/OciApi.php
          curl -sS https://raw.githubusercontent.com/hitrov/oci-arm-host-capacity/main/composer.json > composer.json

      - name: Install Project Dependencies
        run: composer install --no-dev

      - name: Create Temporary API Private Key File
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > oracle_api_key.pem
          chmod 600 oracle_api_key.pem

      - name: Generate Local .env Configuration File
        run: |
          cat <<EOF > .env
          OCI_REGION="${{ secrets.OCI_REGION }}"
          OCI_USER_ID="${{ secrets.OCI_USER_ID }}"
          OCI_TENANCY_ID="${{ secrets.OCI_TENANCY_ID }}"
          OCI_KEY_FINGERPRINT="${{ secrets.OCI_KEY_FINGERPRINT }}"
          OCI_SUBNET_ID="${{ secrets.OCI_SUBNET_ID }}"
          OCI_SSH_PUBLIC_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          OCI_OCPUS="${{ vars.OCI_OCPUS }}"
          OCI_MEMORY_IN_GBS="${{ vars.OCI_MEMORY_IN_GBS }}"
          OCI_PRIVATE_KEY_FILENAME="oracle_api_key.pem"
          EOF

      - name: Run OCI Instance Hunter
        run: php index.php
